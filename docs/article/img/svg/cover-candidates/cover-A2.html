.key,.under,.lamp{-webkit-mask-image:url(car-cut.png);-webkit-mask-size:100% 100%;mix-blend-mode:screen}

.lamp{background:radial-gradient(24px 15px at 710px 252px,rgba(255,120,120,1),rgba(255,77,79,.85) 40%,rgba(255,77,79,.0) 100%),

  background:radial-gradient(closest-side,rgba(255,110,110,.55),rgba(255,77,79,.20) 45%,transparent 100%);mix-blend-mode:screen}
.rim{opacity:.7;mix-blend-mode:screen}
svg{position:absolute;left:0;top:0}
.mark{left:48px;top:574px;height:56px;opacity:.6}
