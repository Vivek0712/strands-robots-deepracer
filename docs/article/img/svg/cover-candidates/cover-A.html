<!doctype html><html><head><meta charset="utf-8"><title>Cover A Judged</title><style>
/* Cover candidate A, "Judged": the car on a dark floor, a probability scale of light under it. */
html,body{margin:0;background:#0b0b10}
.c{position:relative;width:1200px;height:675px;overflow:hidden;background:#0b0b10}
.abs{position:absolute}
/* floor: a slightly lifted plane below the horizon, a cool pool of light under the car */
.floor{left:0;top:0;width:1200px;height:675px;background:
  radial-gradient(520px 120px at 735px 535px,rgba(170,190,215,.13),transparent 70%),
  radial-gradient(900px 260px at 735px 560px,rgba(61,220,255,.045),transparent 70%),
  linear-gradient(180deg,#0b0b10 0%,#0b0b10 52%,#101018 74%,#0d0d13 100%)}
/* backlight so the black body separates from the black ground */
.back{left:0;top:0;width:1200px;height:675px;background:
  radial-gradient(430px 300px at 740px 250px,rgba(61,220,255,.13),transparent 70%),
  radial-gradient(150px 120px at 1032px 272px,rgba(255,77,79,.34),transparent 70%)}
.car{left:313px;top:28px;width:839px}
.refl{left:313px;top:28px;width:839px;transform-origin:50% 489px;transform:scaleY(-1);opacity:.32;filter:blur(1.2px);
  -webkit-mask-image:linear-gradient(180deg,transparent 0%,transparent 45%,rgba(0,0,0,.55) 75%,#000 88%)}
.shadow{left:313px;top:28px;width:839px;opacity:.9}
/* tail light: a faint red bloom at the rear edge, and its smear on the floor */
.tail{left:1000px;top:247px;width:64px;height:50px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,110,110,.55),rgba(255,77,79,.22) 40%,transparent 100%);mix-blend-mode:screen}
.tailfloor{left:950px;top:500px;width:220px;height:44px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,77,79,.14),transparent);filter:blur(6px)}
svg{position:absolute;left:0;top:0}
.mark{left:52px;top:46px;height:44px;opacity:.92}
</style></head><body><div class="c">
<div class="abs floor"></div>
<div class="abs back"></div>
<img class="abs refl" src="car-cut.png">
<div class="abs tailfloor"></div>
<!-- probability scale projected on the floor, an arc in front of the car: red 0..0.35, cyan 0.35..0.65, green 0.65..1 -->
<svg width="1200" height="675" viewBox="0 0 1200 675">
 <defs>
  <filter id="spill" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="16 6"/></filter>
  <filter id="glow" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="3"/></filter>
  <linearGradient id="fadeL" x1="300" x2="1170" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".14" stop-color="#fff"/><stop offset=".86" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="675"><rect x="0" y="0" width="1200" height="675" fill="url(#fadeL)"/></mask>
 </defs>
 <g mask="url(#m)" fill="none" stroke-linecap="butt">
  <!-- light spilled on the floor around the scale -->
  <g filter="url(#spill)" stroke-width="12" opacity=".55">
   <path d="M316.5 534.7 A440 96 0 0 0 577.3 594.6" stroke="#ff4d4f"/>
   <path d="M577.3 594.6 A440 96 0 0 0 892.7 594.6" stroke="#3ddcff"/>
   <path d="M892.7 594.6 A440 96 0 0 0 1153.5 534.7" stroke="#3fb950"/>
  </g>
  <g filter="url(#glow)" stroke-width="5" opacity=".9">
   <path d="M316.5 534.7 A440 96 0 0 0 577.3 594.6" stroke="#ff4d4f"/>
   <path d="M577.3 594.6 A440 96 0 0 0 892.7 594.6" stroke="#3ddcff"/>
   <path d="M892.7 594.6 A440 96 0 0 0 1153.5 534.7" stroke="#3fb950"/>
  </g>
  <g stroke-width="2">
   <path d="M316.5 534.7 A440 96 0 0 0 577.3 594.6" stroke="#ff9a9b"/>
   <path d="M577.3 594.6 A440 96 0 0 0 892.7 594.6" stroke="#a8f0ff"/>
   <path d="M892.7 594.6 A440 96 0 0 0 1153.5 534.7" stroke="#8fe39d"/>
  </g>
 </g>
 <!-- the two thresholds, foreshortened on the floor -->
 <g stroke="#f2f2f7" stroke-linecap="round" fill="none">
  <g filter="url(#glow)" stroke-width="4" opacity=".6"><path d="M589.4 587.4 L565.2 601.8"/><path d="M880.6 587.4 L904.8 601.8"/></g>
  <g stroke-width="2"><path d="M589.4 587.4 L565.2 601.8"/><path d="M880.6 587.4 L904.8 601.8"/></g>
 </g>
</svg>
<img class="abs shadow" src="car-shadow.png">
<img class="abs car" src="car-cut.png">
<div class="abs tail"></div>
<img class="abs mark" src="strands-mark.svg">
</div></body></html>
