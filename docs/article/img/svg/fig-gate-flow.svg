<rect x="1230" y="768" width="163.69736842105263" height="16" rx="4" fill="#7c5cff" stroke="#7c5cff" stroke-width="1.5"/>
<text x="1419.25" y="781" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#f2f2f7" text-anchor="start">429–475 ms</text>
<text x="1222" y="816" font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#a2a2b3" text-anchor="end">whole gate, per hop</text>
