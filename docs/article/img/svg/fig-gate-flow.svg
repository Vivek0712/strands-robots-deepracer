<rect x="40" y="392" width="350" height="190" rx="12" fill="#0f1a12" stroke="#3fb950" stroke-width="1.5"/>
<text x="56" y="428" font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#3fb950" text-anchor="start">Proceed</text>
<text x="56" y="450" font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#f2f2f7" text-anchor="start">the hop runs as planned</text>
<text x="56" y="476" font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#a2a2b3" text-anchor="start"><tspan x="56" dy="0">clear, or unclear below the 0.65 bar (a</tspan><tspan x="56" dy="18">weak call, says so and proceeds)</tspan></text>
<path d="M1360 322 L1360 348 L215.0 348 L215.0 392" fill="none" stroke="#3fb950" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-3fb950)" opacity="0.9"/>
<rect x="410" y="392" width="350" height="190" rx="12" fill="#1a150e" stroke="#ffb347" stroke-width="1.5"/>
<text x="426" y="428" font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#ffb347" text-anchor="start">Guide</text>
<text x="426" y="450" font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#f2f2f7" text-anchor="start">re-plan at half speed</text>
<text x="426" y="476" font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#a2a2b3" text-anchor="start"><tspan x="426" dy="0">obstacle_near: linear halved, the model is</tspan><tspan x="426" dy="18">told to re-plan or stop</tspan></text>
<path d="M1360 322 L1360 348 L585.0 348 L585.0 392" fill="none" stroke="#ffb347" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-ffb347)" opacity="0.9"/>
<rect x="780" y="392" width="350" height="190" rx="12" fill="#0d1a20" stroke="#3ddcff" stroke-width="1.5"/>
<text x="796" y="428" font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#3ddcff" text-anchor="start">Confirm</text>
<text x="796" y="450" font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#f2f2f7" text-anchor="start">ask the operator</text>
<text x="796" y="476" font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#a2a2b3" text-anchor="start"><tspan x="796" dy="0">the envelope question says no, or the</tspan><tspan x="796" dy="18">deterministic check finds a violation;</tspan><tspan x="796" dy="18">Approve / Deny on the Pit Wall, timeout is</tspan><tspan x="796" dy="18">a deny</tspan></text>
<path d="M1360 322 L1360 348 L955.0 348 L955.0 392" fill="none" stroke="#3ddcff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-3ddcff)" opacity="0.9"/>
<rect x="1150" y="392" width="350" height="190" rx="12" fill="#1f0f10" stroke="#ff4d4f" stroke-width="2"/>
<text x="1166" y="428" font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#ff4d4f" text-anchor="start">Deny</text>
<text x="1166" y="450" font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#f2f2f7" text-anchor="start">stop, then a spoken reason</text>
<text x="1166" y="476" font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#a2a2b3" text-anchor="start"><tspan x="1166" dy="0">person_in_frame p ≥ 0.5 · unclear p ≥ 0.65</tspan><tspan x="1166" dy="18">· no frame or decider timeout. Emits stop</tspan><tspan x="1166" dy="18">{cause: deny} and a narrator line: &quot;There</tspan><tspan x="1166" dy="18">is a person in my frame at 95 percent. I</tspan><tspan x="1166" dy="18">will not hop until they step back.&quot;</tspan></text>
<path d="M1360 322 L1360 348 L1325.0 348 L1325.0 392" fill="none" stroke="#ff4d4f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-ff4d4f)" opacity="0.9"/>
<rect x="40" y="598" width="1520" height="64" rx="12" fill="#13131c" stroke="#2a2a3a" stroke-width="1.5"/>
<text x="56" y="625" font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#f2f2f7" text-anchor="start">Every verdict is an event</text>
<text x="56" y="646" font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#a2a2b3" text-anchor="start">verdict {stage, action, reason, class, probability, latency_ms, frame_ref} → events.jsonl → Pit Wall Stage, the narrator, and the why_stopped tool for the Apology beat</text>
<text x="1544" y="625" font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ff4d4f" text-anchor="end">a Deny also emits stop {cause: deny}</text>
<text x="1544" y="646" font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#6b6b80" text-anchor="end">no motion event follows a Deny (person-gate run, 2026-10-15)</text>
<rect x="40" y="682" width="480" height="180" rx="12" fill="#13131c" stroke="#2a2a3a" stroke-width="1.5"/>
<text x="56" y="710" font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#f2f2f7" text-anchor="start">Thresholds</text>
<text x="56" y="740" font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13.5" text-anchor="start"><tspan fill="#a2a2b3" font-weight="400">deny threshold </tspan><tspan fill="#f2f2f7" font-weight="700">0.5</tspan><tspan fill="#a2a2b3" font-weight="400">  person yes/no and person_in_frame</tspan></text>
<text x="56" y="764" font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13.5" text-anchor="start"><tspan fill="#a2a2b3" font-weight="400">unclear bar </tspan><tspan fill="#f2f2f7" font-weight="700">0.65</tspan><tspan fill="#a2a2b3" font-weight="400">  DEEPRACER_UNCLEAR_THRESHOLD</tspan></text>
<text x="56" y="792" font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#6b6b80" text-anchor="start"><tspan x="56" dy="0">a weak unclear (0.54) proceeds and says so; a strong one</tspan><tspan x="56" dy="17">(0.66) stops. Calibrated 2026-10-14 on real booth</tspan><tspan x="56" dy="17">frames: the five-way alone called a person at desk</tspan><tspan x="56" dy="17">distance unclear 0.58–0.67.</tspan></text>
<rect x="540" y="682" width="480" height="180" rx="12" fill="#13131c" stroke="#2a2a3a" stroke-width="1.5"/>
<text x="556" y="710" font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#f2f2f7" text-anchor="start">Modes</text>
<rect x="556" y="728" width="86" height="24" rx="6" fill="#ff4d4f" stroke="#ff4d4f" stroke-width="1.5" opacity="0.9"/>
<text x="599" y="745" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#0b0b10" text-anchor="middle">enforce</text>
<text x="654" y="745" font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#a2a2b3" text-anchor="start"><tspan x="654" dy="0">a Deny, Guide or Confirm blocks the hop (the</tspan><tspan x="654" dy="16">default)</tspan></text>
<rect x="556" y="764" width="86" height="24" rx="6" fill="#ffb347" stroke="#ffb347" stroke-width="1.5" opacity="0.9"/>
<text x="599" y="781" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#0b0b10" text-anchor="middle">advisory</text>
<text x="654" y="781" font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#a2a2b3" text-anchor="start"><tspan x="654" dy="0">the verdict is shown and logged, never</tspan><tspan x="654" dy="16">blocks the hop</tspan></text>
<rect x="556" y="800" width="86" height="24" rx="6" fill="#6b6b80" stroke="#6b6b80" stroke-width="1.5" opacity="0.9"/>
<text x="599" y="817" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#0b0b10" text-anchor="middle">off</text>
<text x="654" y="817" font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#a2a2b3" text-anchor="start"><tspan x="654" dy="0">no decider check on this hop; one Proceed</tspan><tspan x="654" dy="16">verdict says so</tspan></text>
<rect x="1040" y="682" width="520" height="180" rx="12" fill="#13131c" stroke="#2a2a3a" stroke-width="1.5"/>
<text x="1056" y="710" font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#f2f2f7" text-anchor="start">Measured on the car, one decider loaded</text>
<text x="1222" y="744" font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#a2a2b3" text-anchor="end">envelope question</text>
