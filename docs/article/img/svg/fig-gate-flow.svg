<text x="1334.157894736842" y="745" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#f2f2f7" text-anchor="start">225–252 ms</text>
<text x="1222" y="780" font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#a2a2b3" text-anchor="end">frame: person + five-way</text>
