<text x="1056" y="850" font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#6b6b80" text-anchor="start">a person in frame was denied in 456 ms · gate.py and the 2026-10-15 person-gate run</text>
<text x="1560" y="886" font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#6b6b80" text-anchor="end" font-style="italic">Physics stops the car; the decider explains.</text>
