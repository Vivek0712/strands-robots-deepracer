<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="One hop through the DeciderGate: tool call, envelope question, frame grab, person question and five-way class in one request, merge toward Deny, then Proceed, Guide, Confirm or Deny">
<rect width="1600" height="900" fill="#0b0b10"/>
<defs><marker id="arrow-a2a2b3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#a2a2b3"/></marker><marker id="arrow-3fb950" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#3fb950"/></marker><marker id="arrow-ffb347" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#ffb347"/></marker><marker id="arrow-3ddcff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#3ddcff"/></marker><marker id="arrow-ff4d4f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z" fill="#ff4d4f"/></marker></defs>
<text x="40" y="54" font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#f2f2f7" text-anchor="start">One hop through the DeciderGate</text>
<text x="40" y="82" font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" fill="#a2a2b3" text-anchor="start">before_tool_call on drive_deepracer: two typed questions to a local Strands Decider 2B, the most severe answer wins, and every verdict is written to the event log with its latency.</text>
<rect x="40" y="150" width="250" height="172" rx="12" fill="#191926" stroke="#3a3a52" stroke-width="1.5"/>
<text x="56" y="180" font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#f2f2f7" text-anchor="start">drive_deepracer</text>
<text x="56" y="200" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#a2a2b3" text-anchor="start">the tool call</text>
<text x="56" y="226" font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#a2a2b3" text-anchor="start"><tspan x="56" dy="0">linear, angular, duration</tspan><tspan x="56" dy="18">from Nova Pro&#x27;s plan or the</tspan><tspan x="56" dy="18">operator&#x27;s words</tspan></text>
<rect x="330" y="150" width="270" height="172" rx="12" fill="#17132b" stroke="#7c5cff" stroke-width="1.5"/>
<text x="346" y="180" font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#f2f2f7" text-anchor="start">Envelope question</text>
<text x="346" y="200" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#7c5cff" text-anchor="start">225–252 ms</text>
<text x="346" y="226" font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#a2a2b3" text-anchor="start"><tspan x="346" dy="0">noul: &quot;Is this drive command</tspan><tspan x="346" dy="18">inside the briefed envelope?&quot;</tspan><tspan x="346" dy="18">beside a deterministic check in</tspan><tspan x="346" dy="18">code (|linear| ≤ 0.3 m/s,</tspan><tspan x="346" dy="18">duration ≤ 2 s, direction</tspan><tspan x="346" dy="18">allowed)</tspan></text>
<rect x="640" y="150" width="220" height="172" rx="12" fill="#0d1a20" stroke="#3ddcff" stroke-width="1.5"/>
<text x="656" y="180" font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#f2f2f7" text-anchor="start">Frame grab</text>
<text x="656" y="200" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#3ddcff" text-anchor="start">vision unavailable → Deny</text>
<text x="656" y="226" font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#a2a2b3" text-anchor="start"><tspan x="656" dy="0">newest JPEG from the</tspan><tspan x="656" dy="18">shared CameraStream; no</tspan><tspan x="656" dy="18">frame, no decider, or an</tspan><tspan x="656" dy="18">answer slower than 1.5 s</tspan><tspan x="656" dy="18">is a Deny: the gate fails</tspan><tspan x="656" dy="18">closed</tspan></text>
<rect x="900" y="150" width="300" height="172" rx="12" fill="#17132b" stroke="#7c5cff" stroke-width="1.5"/>
<text x="916" y="180" font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#f2f2f7" text-anchor="start">Person + five-way class</text>
<text x="916" y="200" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#7c5cff" text-anchor="start">429–475 ms</text>
<text x="916" y="226" font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#a2a2b3" text-anchor="start"><tspan x="916" dy="0">one request over the same frame:</tspan><tspan x="916" dy="18">noul &quot;is a person visible?&quot; and a</tspan><tspan x="916" dy="18">choice among clear · obstacle_near ·</tspan><tspan x="916" dy="18">person_in_frame · off_surface ·</tspan><tspan x="916" dy="18">unclear</tspan></text>
<rect x="1240" y="150" width="240" height="172" rx="12" fill="#17132b" stroke="#5a4a9a" stroke-width="1.5"/>
<text x="1256" y="180" font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#f2f2f7" text-anchor="start">Merge toward Deny</text>
<text x="1256" y="200" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#5a4a9a" text-anchor="start">no model call</text>
<text x="1256" y="226" font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#a2a2b3" text-anchor="start"><tspan x="1256" dy="0">person yes/no p ≥ 0.5 →</tspan><tspan x="1256" dy="18">class person_in_frame at p,</tspan><tspan x="1256" dy="18">whatever the five-way said;</tspan><tspan x="1256" dy="18">the pre-check can add a</tspan><tspan x="1256" dy="18">Deny, never remove one; most</tspan><tspan x="1256" dy="18">severe action wins</tspan></text>
