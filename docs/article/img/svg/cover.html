<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#07070c}
.c{position:relative;width:1200px;height:675px;overflow:hidden;background:
 radial-gradient(520px 320px at 78% 52%,rgba(61,220,255,.22),transparent 65%),
 radial-gradient(700px 420px at 20% 20%,rgba(124,92,255,.28),transparent 60%),
 radial-gradient(600px 300px at 60% 110%,rgba(255,107,61,.25),transparent 60%),
 linear-gradient(180deg,#0b0b14 0%,#07070c 100%)}
.floor{position:absolute;left:-200px;right:-200px;bottom:0;height:300px;
 background-image:linear-gradient(rgba(124,92,255,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(124,92,255,.22) 1px,transparent 1px);
 background-size:80px 80px;transform:perspective(600px) rotateX(62deg);transform-origin:50% 100%;
 -webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 55%,#000 100%);opacity:.9}
.car{position:absolute;left:470px;top:60px;width:700px;filter:drop-shadow(0 30px 50px rgba(0,0,0,.7)) drop-shadow(0 0 40px rgba(61,220,255,.25))}
svg.rib{position:absolute;inset:0;width:1200px;height:675px}
.mark{position:absolute;left:92px;top:250px;width:150px;filter:drop-shadow(0 0 28px rgba(63,185,80,.65))}
.halo{position:absolute;left:36px;top:196px;width:262px;height:262px;border-radius:50%;background:radial-gradient(circle,rgba(63,185,80,.28),rgba(124,92,255,.12) 55%,transparent 70%)}
.dot{position:absolute;width:10px;height:10px;border-radius:50%}
</style></head><body><div class="c">
<div class="floor"></div>
<svg class="rib" viewBox="0 0 1200 675">
 <defs>
  <linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#ff6b3d" stop-opacity="0"/><stop offset=".5" stop-color="#ff6b3d"/><stop offset="1" stop-color="#3ddcff" stop-opacity="0"/></linearGradient>
  <linearGradient id="g2" x1="0" x2="1"><stop offset="0" stop-color="#7c5cff" stop-opacity="0"/><stop offset=".5" stop-color="#7c5cff"/><stop offset="1" stop-color="#3fb950" stop-opacity="0"/></linearGradient>
  <linearGradient id="g3" x1="0" x2="1"><stop offset="0" stop-color="#3ddcff" stop-opacity="0"/><stop offset=".5" stop-color="#3ddcff"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></linearGradient>
 </defs>
 <g fill="none" stroke-width="7" stroke-linecap="round" opacity=".95">
  <path d="M-40 300 C 200 180, 330 420, 560 300 S 760 230, 830 258" stroke="url(#g1)"/>
  <path d="M-40 380 C 220 300, 360 500, 600 360 S 790 300, 840 280" stroke="url(#g2)"/>
  <path d="M-40 460 C 260 380, 380 560, 640 430 S 800 360, 850 300" stroke="url(#g3)"/>
 </g>
 <g fill="none" stroke-width="2" stroke-dasharray="6 14" opacity=".55">
  <path d="M-40 330 C 200 220, 330 450, 560 330 S 760 260, 830 268" stroke="#ff6b3d"/>
  <path d="M-40 410 C 220 330, 360 530, 600 390 S 790 330, 840 290" stroke="#7c5cff"/>
 </g>
</svg>
<div class="halo"></div>
<img class="mark" src="strands-mark.svg">
<img class="car" src="fig-deepracer.png">
<div class="dot" style="left:300px;top:308px;background:#ffb347;box-shadow:0 0 16px #ffb347"></div>
<div class="dot" style="left:430px;top:350px;background:#3ddcff;box-shadow:0 0 16px #3ddcff"></div>
<div class="dot" style="left:380px;top:430px;background:#7c5cff;box-shadow:0 0 16px #7c5cff"></div>
</div></body></html>
