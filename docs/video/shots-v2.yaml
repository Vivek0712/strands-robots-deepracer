      - {kind: panel, box: [96, 244, 98, 316], color: cyan, alpha: 1.0, radius: 0, in: "s3%28", <<: *m_draw_bar, z: 50}
      - {kind: label, <<: *t_body_s, color: ink, text: "Is the proposed movement inside the envelope the operator briefed?", pos: [420, 244], width: 674, in: "s3%28+0.06", <<: *m_enter_left, z: 50}
      - {kind: panel, box: [96, 344, 98, 416], color: orange, alpha: 1.0, radius: 0, in: "s3%44", <<: *m_draw_bar, accent_group: grounded, z: 50}
      - {kind: label, <<: *t_body_s, color: ink, text: "Are the tool's argument values grounded in what the user actually said?", pos: [420, 344], width: 674, in: "s3%44+0.06", <<: *m_enter_left, z: 50}
      - {kind: panel, box: [96, 444, 98, 516], color: cyan, alpha: 1.0, radius: 0, in: "s3%78", <<: *m_draw_bar, z: 50}
      - {kind: label, <<: *t_body_s, color: ink, text: "What did the user most recently ask the robot to do?", pos: [420, 444], width: 674, in: "s3%78+0.06", <<: *m_enter_left, z: 50}
      # request 2
      - {kind: label, <<: *t_caption, color: ink-dim, text: "Request 2: the frame, 480x360 JPEG", pos: [96, 556], in: "s4", <<: *m_enter_left, z: 50}
      - {kind: panel, box: [96, 600, 98, 636], color: cyan, alpha: 1.0, radius: 0, in: "s4%42", <<: *m_draw_bar, z: 50}
