# Shot list for the hackathon demo video, version 2: the production design pass of
# docs/video/STORYBOARD-v2.md (revision 2) on the design system in docs/video/DESIGN.md.
# Ids, durations, VO text, vo_* settings, sentence anchors and the min/fixed timings are copied
# from docs/video/shots.yaml (v1) and do not move; everything visual is new.
# Coordinates are 1920x1080 frame units; times are seconds from the shot's own start.
# Render: .venv/bin/python -m docs.video.render build docs/video/shots-v2.yaml --out docs/video/build/deepracer-decider-demo-v2.mp4

title: "This car can refuse an order"
voice: Matthew
engine: generative     # generative ignores <prosody rate>; sentences are synthesised one by one instead
vo_sentences: true     # one Polly call per sentence, stitched with vo_gap_ms of silence; onsets measured
vo_gap_ms: 600         # 600 ms of real silence between sentences (tails kept to 120 ms past -50 dBFS)
auto_pad: 0.5          # picture = max(min, vo_offset + VO length + 0.5 s)
fade_out: 0            # the only dip to black is inside shot 14 (black_out 0.72 on the camera curve)
# DESIGN.md section 5: vignette 18 percent at the corners, zero inside r 0.60; grain sigma 3 levels
vignette: 0.18
vignette_inner: 0.60
grain: 0.01176         # 3 / 255
grain_size: 2
grain_cap: 16
rules:                 # `check` extensions (DESIGN 15 and 3.1)
  caption_zone: [940, 1040]
  one_accent: true
  accent: orange
defaults:
  transition: cut

# ---------------------------------------------------------------------------- tokens (YAML anchors)
# DESIGN.md section 17. Colours are the renderer palette names (bg, surface, surface2, ink, ink-dim,
# ink-mute, orange, cyan, green, amber, red); a colour or a size changes here, once.
snippets:
  type:
    display: &t_display {font: sans_bold, size: 96, leading: 104, track: -0.02}
    display_m: &t_display_m {font: sans_bold, size: 72, leading: 80, track: -0.015}
    title: &t_title {font: sans_bold, size: 56, leading: 64, track: -0.015}
    title_s: &t_title_s {font: sans_bold, size: 48, leading: 56, track: -0.01}
    heading: &t_heading {font: sans_medium, size: 40, leading: 48, track: -0.01}
    label_l: &t_label_l {font: sans_medium, size: 36, leading: 44, track: -0.005}
    body: &t_body {font: sans, size: 32, leading: 42}
    body_s: &t_body_s {font: sans, size: 28, leading: 36}
    body_xs: &t_body_xs {font: sans, size: 26, leading: 34}
    lower_third: &t_lt {font: sans_medium, size: 32, leading: 40}
    caption: &t_caption {font: sans_medium, size: 22, leading: 28, track: 0.02}
    mono: &t_mono {font: mono, size: 28, leading: 44}
    mono_code: &t_mono_code {font: mono, size: 26, leading: 38}
    mono_s: &t_mono_s {font: mono, size: 22, leading: 30}
    mono_xs: &t_mono_xs {font: mono, size: 20, leading: 26}
    url: &t_url {font: mono, size: 32, leading: 40}
  motion:
    enter: &m_enter {anim: rise, travel: 16, anim_ms: 480, ease: enter}
    enter_left: &m_enter_left {anim: rise_left, travel: 16, anim_ms: 480, ease: enter}
    enter_right: &m_enter_right {anim: rise_right, travel: 16, anim_ms: 480, ease: enter}
    exit: &m_exit {out_ms: 240, out_ease: exit}
    chip_in: &m_chip {anim: scale_in, scale_from: 0.92, anim_ms: 480, ease: enter}
    draw_bar: &m_draw_bar {anim: grow_down, anim_ms: 240, ease: draw}
    recolor_dim: &m_recolor_dim {color: ink-dim, over_ms: 240, ease: move}
  surfaces:
    panel: &panel_v2 {kind: panel, color: surface, alpha: 1.0, radius: 12, border: {color: ink, alpha: 0.12}, shadow: {blur: 40, alpha: 0.5, dy: 12}, inner_shadow: true}
    panel_hollow: &panel_hollow {kind: panel, hollow: true, radius: 12, border: {color: ink, alpha: 0.12}, shadow: {blur: 40, alpha: 0.5, dy: 12}, z: 20}
    plate: &plate_over_footage {color: bg, alpha: 0.72, radius: 8}
    pill_plate: &pill_plate {color: surface, alpha: 0.85, radius: 20, pad: 18, border: {color: ink, alpha: 0.12}}
  chrome:
    rail: &rail
      kind: progress_rail
      segments: [[0, 144], [150, 382], [388, 1335], [1341, 1687], [1693, 1920]]
      chapters: [[0.0, 13.5], [13.5, 35.2], [35.2, 123.73], [123.73, 156.07], [156.07, 176.31]]
      y: [0, 3]
      track_color: ink-mute
      track_alpha: 0.35
      fill_color: ink-dim
      head_color: orange
      head_px: 16
      draw_on: {at: 1.06, ms: 720, ease: draw}
      chrome: true
      z: 97
    kicker: &kicker {kind: mono, size: 22, leading: 28, color: orange, pos: [96, 72], caps: true, track: 0.08, middot: true, chrome: true, z: 95}
    pill: &pill {kind: mono, size: 22, leading: 28, color: ink-dim, caps: true, track: 0.06, pos: [1806, 72], anchor: tr, plate: {<<: *pill_plate, y: [62, 102]}, z: 96}
    pill2: &pill2 {kind: mono, size: 22, leading: 28, color: ink-dim, caps: true, track: 0.06, pos: [1806, 120], anchor: tr, plate: {<<: *pill_plate, y: [110, 150]}, z: 96}
    badge: &badge {kind: mono, size: 22, leading: 30, color: ink-dim, text: "Agent: Amazon Nova Pro on Bedrock\nJudge: Strands Decider 2B, local", pos: [1824, 866], anchor: tr, align: right, z: 94}
    badge_plated: &badge_plated {kind: mono, size: 22, leading: 30, color: ink-dim, text: "Agent: Amazon Nova Pro on Bedrock\nJudge: Strands Decider 2B, local", pos: [1824, 866], anchor: tr, align: right, plate: {color: bg, alpha: 0.72, radius: 8, pad: 16, pad_y: 6}, z: 94}
    # lower-third (DESIGN 9): bar 96..99 x 872..908 draws top to bottom over 240 ms, text at +60 ms
    lt_bar: &lt_bar {kind: line, from: [97.5, 872], to: [97.5, 908], width: 3, color: orange, draw_ms: 240, ease: draw, chrome: true, z: 93}
    lt_bar_static: &lt_bar_static {kind: panel, box: [96, 872, 99, 908], color: orange, alpha: 1.0, radius: 0, chrome: true, z: 93}
    lt_text: &lt_text {kind: label, <<: *t_lt, color: ink, pos: [116, 878], <<: *m_enter_left, z: 93}
    lt_plate: &lt_plate {kind: panel, <<: *plate_over_footage, anim_ms: 240, ease: enter, z: 92}
    divider: &divider {kind: panel, box: [1106, 200, 1107, 848], color: ink, alpha: 0.12, radius: 0, z: 30}
    chip: &chip {kind: chip, size: 24, track: 0.04, <<: *m_chip, z: 60}
    safety_line: &safety "Physics stops the car. The decider explains."

shots:
  # ---------------------------------------------------------------- 1  HOOK A: the Deny, then the title
  - id: s01-hook-a
    kind: clip
    src: docs/results/portal/pitwall-sim.webm
    start: 2.5
    end: 3.2                       # then hold the 3.2 s frame (DENY, LED red)
    crop: [0, 40, 910, 455]        # live view + verdict and thought panels, 1.60x into the panel
    place: [232, 160, 1688, 824]
    subject_zoom: {from: 1.0, to: 1.03, start: 0.7, end: 4.0, center: [1205, 360], ease: drift}
    mute: true
    duration: auto
    min: 4.0
    vo_offset: 1.0
    vo: "This car can refuse an order."
    text:
      - {<<: *panel_hollow, box: [232, 160, 1688, 824]}
      - {kind: bloom, center: [1556, 188], r: 24, color: red, alpha_peak: 0.60, alpha_floor: 0.15, pulses: 2, period_ms: 330, in: 0.4, ease: enter, z: 30}
      - kind: spotlight
        dim: 0.6
        feather: 48
        radius: 12
        regions:
          - {at: 0.7, box: [1040, 280, 1370, 440], fade_ms: 480, ease: enter}
          - {at: 0.7, box: [1540, 164, 1680, 212], fade_ms: 480, ease: enter}
        z: 40
      - {kind: title, <<: *t_display, text: "This car can refuse an order.", color: ink, pos: [960, 560], anchor: tc, in: 1.06, <<: *m_enter, z: 50}
      - {<<: *pill, text: "SIM, FAKE DECIDER, DRAWN FIGURE"}
      - *rail

  # ---------------------------------------------------------------- 1b THE CAR (phase-3 recording, two parts, 4.0 s)
  - id: s01b-feed
    kind: clip
    src: docs/video/build/clips/phase3-replan-1080p.mp4
    start: 2.8
    end: 4.4
    crop: [391, 27, 1524, 1060]    # the feed image and its log plate
    place: [564, 120, 1357, 843]   # 0.70x in a panel
    fill: blur
    fill_blur: 32
    fill_brightness: 0.25
    mute: true
    duration: 1.6
    vo_offset: 0.5
    vo: "This is a stock AWS DeepRacer."
    text:
      - {<<: *panel_hollow, box: [564, 120, 1357, 843]}
      - {<<: *lt_plate, box: [80, 860, 509, 920], in: 0.56}
      - {<<: *lt_text, text: "A stock AWS DeepRacer", in: 0.62}
      - {<<: *pill, text: "REAL CAR, PHASE-3 VISION PLANNER, PRE-DECIDER", plate: {<<: *pill_plate, alpha: 1.0, y: [62, 102]}}
      - *rail
    pointers:
      - {<<: *lt_bar, in: 0.56}
  - id: s01b-car
    kind: clip
    src: docs/video/build/clips/phase3-thirdperson-1080p.mp4
    start: 4.6
    end: 7.0
    place: [0, 0, 1920, 1080]      # the phone column fitted to 1080 over its own darkened blur
    mute: true
    duration: 2.4
    text:
      - {kind: panel, <<: *plate_over_footage, box: [80, 860, 509, 920], z: 92}
      - {<<: *lt_bar_static}
      - {kind: label, <<: *t_lt, color: ink, pos: [116, 878], text: "A stock AWS DeepRacer", z: 93}
      - {<<: *pill, text: "REAL CAR, PHASE-3 VISION PLANNER, PRE-DECIDER", plate: {<<: *pill_plate, alpha: 1.0, y: [62, 102]}}
      - *rail

  # ---------------------------------------------------------------- 2  HOOK B: here is why
  # VO sentences: s1 "A person in the frame."  s2 "The hop was refused."  s3 "Here is why."
  - id: s02-hook-b
    kind: still
    src: docs/results/portal/pitwall-sim.webm
    at: 3.2                        # the shot 1 freeze frame
    crop: [0, 40, 910, 455]
    place: [232, 160, 1688, 824]
    duration: auto
    min: 5.5
    vo_offset: 0.3
    vo: "A person in the frame. The hop was refused. Here is why."
    text:
      - {<<: *panel_hollow, box: [232, 160, 1688, 824]}
      - kind: spotlight
        dim: 0.6
        feather: 48
        radius: 12
        regions:
          - {at: "s1", shape: ellipse, center: [640, 533], rx: 200, ry: 260, fade_ms: 480, ease: enter}
          - {at: "s1%60", box: [272, 709, 544, 789], fade_ms: 480, ease: enter}
          - {at: "s1%60+0.06", box: [851, 709, 1006, 789], fade_ms: 480, ease: enter}
          - {at: "s2", box: [1062, 296, 1346, 424], fade_ms: 480, ease: enter}
        lift: [{at: "s3", dim: 0.3, over_ms: 480, ease: move}]
        z: 40
      - {kind: title, <<: *t_title_s, text: "Here is why.", color: ink, pos: [232, 92], in: "s3", <<: *m_enter, z: 50}
      - {kind: label, <<: *t_body_s, color: ink-dim, text: *safety, pos: [1688, 852], anchor: tr, z: 55}
      - {<<: *pill, text: "SIM, FAKE DECIDER, DRAWN FIGURE"}
      - *rail
    pointers:
      - {kind: box, from: [272, 709], to: [544, 789], color: cyan, width: 2, radius: 8, in: "s1%60", draw_ms: 480, ease: draw, z: 45}
      - {kind: box, from: [851, 709], to: [1006, 789], color: cyan, width: 2, radius: 8, in: "s1%60+0.06", draw_ms: 480, ease: draw, z: 45}
      - {kind: box, from: [1062, 296], to: [1346, 424], color: red, width: 2, radius: 8, in: "s2", draw_ms: 480, ease: draw, z: 46}

  # ---------------------------------------------------------------- 3  WHAT IT IS: driven as a Strands robot
  # VO sentences: s1 "I am Vivek Raja."  s2 "A Strands agent on Bedrock turns my words into hops; a local
  # Decider two B judges each one before the wheels turn."  The car points out its parts: dot, leader, label.
  - id: s03-what-it-is
    kind: still
    src: docs/video/build/clips/layers/base.png     # the figure's HTML rendered with the callouts hidden
    crop: [200, 100, 1600, 860]    # below the figure's baked title; the dots below are in frame units
    place: [260, 160, 1660, 920]   # the same source-to-frame offset (+60, +60) as crop 60..860 at 120
    subject_zoom: {from: 1.0, to: 1.04, center: [998, 400], ease: drift, clip: true}
    duration: auto
    min: 9.5
    vo_offset: 0.4
    vo: "I am Vivek Raja. A Strands agent on Bedrock turns my words into hops; a local Decider two B judges each one before the wheels turn."
    transition: {kind: push_left, duration: 0.72, ease: camera, inside: true}
    text:
      - {<<: *kicker, text: "THE SYSTEM  .  1 OF 2"}
      - {kind: title, <<: *t_title, text: "Driven as a Strands robot", color: ink, pos: [96, 104], z: 92}
      # labels land at the leader's end: anchor + 240 ms dot + 360 ms leader
      - {kind: label, <<: *t_label_l, color: ink, text: "Agents as the loop", pos: [1360, 330], in: "s2+0.6", <<: *m_enter_left, settle: [{at: 8.5, alpha: 0.7, over_ms: 240}], z: 40}
      - {kind: label, <<: *t_label_l, color: ink, text: "Bidi as the voice", pos: [1360, 440], in: "s2%25+0.6", <<: *m_enter_left, settle: [{at: 8.5, alpha: 0.7, over_ms: 240}], z: 40}
      - {kind: label, <<: *t_label_l, color: ink, text: "strands-robots on the drive", pos: [640, 500], anchor: tr, in: "s2%40+0.6", <<: *m_enter_right, settle: [{at: 8.5, alpha: 0.7, over_ms: 240}], z: 40}
      - {kind: label, <<: *t_label_l, color: orange, text: "Decider on the camera", pos: [640, 270], anchor: tr, in: "s2%50+0.6", <<: *m_enter_right, accent_group: decider, z: 40}
      - {kind: label, <<: *t_label_l, color: ink, text: "The deadman on the servos", pos: [640, 620], anchor: tr, in: "s2%85+0.6", <<: *m_enter_right, settle: [{at: 8.5, alpha: 0.7, over_ms: 240}], z: 40}
      - {kind: label, <<: *t_label_l, color: ink, alpha: 0.7, text: "Harness on the compute", pos: [1360, 220], in: 7.40, <<: *m_enter_left, z: 40}
      - {kind: label, <<: *t_label_l, color: ink, alpha: 0.7, text: "Box around the process", pos: [1360, 640], in: 7.46, <<: *m_enter_left, z: 40}
      - {<<: *lt_text, text: "Vivek Raja, AWS AI Hero", in: "s1+0.30"}
      - {<<: *badge_plated, in: "s2", anim_ms: 480, ease: enter}
      - *rail
    pointers:
      - {<<: *lt_bar, in: "s1+0.24"}
      # dot, then the leader outward to the label's edge; only the Decider pings
      - {kind: leader, from: [1108, 361], to: [1344, 352], dot_at: start, dot_ms: 240, width: 1.5, dot: 5, color: ink, alpha: 0.7, in: "s2", draw_ms: 360, ease: draw, attach: true, z: 30}
      - {kind: leader, from: [1244, 393], to: [1344, 462], dot_at: start, dot_ms: 240, width: 1.5, dot: 5, color: ink, alpha: 0.7, in: "s2%25", draw_ms: 360, ease: draw, attach: true, z: 30}
      - {kind: leader, from: [762, 529], to: [656, 522], dot_at: start, dot_ms: 240, width: 1.5, dot: 5, color: ink, alpha: 0.7, in: "s2%40", draw_ms: 360, ease: draw, attach: true, z: 30}
      - {kind: leader, from: [966, 297], to: [656, 292], dot_at: start, dot_ms: 240, width: 1.5, dot: 5, color: orange, alpha: 0.7, in: "s2%50", draw_ms: 360, ease: draw, ping: true, attach: true, accent_group: decider, z: 30}
      - {kind: leader, from: [1046, 563], to: [656, 642], dot_at: start, dot_ms: 240, width: 1.5, dot: 5, color: ink, alpha: 0.7, in: "s2%85", draw_ms: 360, ease: draw, attach: true, z: 30}
      - {kind: leader, from: [1069, 236], to: [1344, 242], dot_at: start, dot_ms: 1, width: 1.5, dot: 5, color: ink, alpha: 0.7, in: 7.40, draw_ms: 480, ease: enter, attach: true, z: 30}
      - {kind: leader, from: [964, 639], to: [1344, 662], dot_at: start, dot_ms: 1, width: 1.5, dot: 5, color: ink, alpha: 0.7, in: 7.46, draw_ms: 480, ease: enter, attach: true, z: 30}

  # ---------------------------------------------------------------- 4  ARCHITECTURE: the guided zoom, re-keyed to the voice
  # VO sentences: s1 "Nova Pro proposes the move."  s2 "A Strands intervention handler asks the decider before
  # the tool runs."  s3 "The on-car deadman needs none of it."  Stops: Bedrock (0.80), Strands Agents +
  # strands-robots (s2), DeciderGate + Decider 2B (s2%45), the deadman node (s3), pull-back (10.90).
  - id: s04-architecture
    kind: still
    src: docs/video/build/clips/figs/fig-architecture-v2-3840.png   # the article SVG with its command arrows and 20 Hz labels in ink-dim, legend and footer stripped
    camera:
      - {at: 0.0, view: [0.5, 0.5, 1.0]}
      - {at: 0.8, view: [0.269, 0.25, 2.0], ease: camera, over: 0.72}
      - {at: "s2", view: [0.272, 0.53, 1.8], ease: camera, over: 0.72}
      - {at: "s2%45", view: [0.366, 0.367, 3.0], ease: camera, over: 0.72}
      - {at: "s3", view: [0.790, 0.620, 2.4], ease: camera, over: 0.72}
      - {at: 10.9, view: [0.5, 0.5, 1.0], ease: camera, over: 0.72}
    duration: auto
    min: 12.2
    vo_offset: 0.3
    vo: "Nova Pro proposes the move. A Strands intervention handler asks the decider before the tool runs. The on-car deadman needs none of it."
    text:
      - {<<: *lt_bar_static}
      - {<<: *kicker, text: "THE SYSTEM  .  2 OF 2", plate: {color: bg, alpha: 0.72, radius: 8, pad: 16, pad_y: 10}}
      - kind: spotlight
        dim: 0.6
        feather: 48
        radius: 8
        regions:
          - {at: 1.40, box: [24, 68, 1896, 374], fade_ms: 480, ease: enter, out: "s2", out_ms: 480}
          - {at: "s2+0.6", box: [173, 99, 1706, 827], fade_ms: 480, ease: enter, out: "s2%45", out_ms: 480}
          - {at: "s2%45+0.6", box: [223, 335, 1699, 745], fade_ms: 480, ease: enter, out: "s3", out_ms: 480}
          - {at: "s3+0.6", box: [488, 200, 1756, 646], fade_ms: 480, ease: enter, out: 10.9, out_ms: 480}
        z: 40
      # the step panel grows upward as rows arrive; rows ride up with it (pitch 40, top + 24)
      - {kind: panel, box: [1272, 780, 1824, 848], color: surface, alpha: 0.92, radius: 12, border: {color: ink, alpha: 0.12}, in: 1.40, anim_ms: 240, ease: enter, move: [{at: "s2+0.6", box: [1272, 740, 1824, 848], over_ms: 240, ease: move}, {at: "s2%45+0.6", box: [1272, 700, 1824, 848], over_ms: 240, ease: move}, {at: "s3+0.6", box: [1272, 660, 1824, 848], over_ms: 240, ease: move}], z: 60}
      - {kind: label, <<: *t_body_xs, color: orange, text: "1 Nova Pro proposes the move", pos: [1296, 804], in: 1.40, <<: *m_enter_left, recolor: [{at: "s2+0.6", <<: *m_recolor_dim}], move: [{at: "s2+0.6", pos: [1296, 764], over_ms: 240, ease: move}, {at: "s2%45+0.6", pos: [1296, 724], over_ms: 240, ease: move}, {at: "s3+0.6", pos: [1296, 684], over_ms: 240, ease: move}], z: 62}
      - {kind: label, <<: *t_body_xs, color: orange, text: "2 Strands Agents runs the tools", pos: [1296, 804], in: "s2+0.6", <<: *m_enter_left, recolor: [{at: "s2%45+0.6", <<: *m_recolor_dim}], move: [{at: "s2%45+0.6", pos: [1296, 764], over_ms: 240, ease: move}, {at: "s3+0.6", pos: [1296, 724], over_ms: 240, ease: move}], z: 62}
      - {kind: label, <<: *t_body_xs, color: orange, text: "3 Decider 2B judges, before the tool runs", pos: [1296, 804], in: "s2%45+0.6", <<: *m_enter_left, recolor: [{at: "s3+0.6", <<: *m_recolor_dim}], move: [{at: "s3+0.6", pos: [1296, 764], over_ms: 240, ease: move}], z: 62}
      - {kind: label, <<: *t_body_xs, color: orange, text: "4 On-car deadman: stops without the laptop", pos: [1296, 804], in: "s3+0.6", <<: *m_enter_left, z: 62}
      - {<<: *lt_plate, box: [80, 860, 321, 920], in: 0}
      - {kind: label, <<: *t_lt, color: ink, pos: [116, 878], text: "Architecture", z: 93}
      - *badge_plated
      - *rail
    pointers:
      # focus frames: cyan, the deadman node red (the physical layer); each exits as the next move begins
      - {kind: box, from: [24, 68], to: [1896, 374], color: cyan, width: 2, radius: 8, in: 1.40, draw_ms: 480, ease: draw, out: "s2", <<: *m_exit, z: 45}
      - {kind: box, from: [173, 99], to: [778, 345], color: cyan, width: 2, radius: 8, in: "s2+0.6", draw_ms: 480, ease: draw, out: "s2%45", <<: *m_exit, z: 45}
      - {kind: box, from: [173, 380], to: [1706, 827], color: cyan, width: 2, radius: 8, in: "s2+0.66", draw_ms: 480, ease: draw, out: "s2%45", <<: *m_exit, z: 45}
      - {kind: box, from: [223, 335], to: [1699, 745], color: cyan, width: 2, radius: 8, in: "s2%45+0.6", draw_ms: 480, ease: draw, out: "s3", <<: *m_exit, z: 45}
      - {kind: box, from: [488, 200], to: [1756, 646], color: red, width: 2, radius: 8, in: "s3+0.6", draw_ms: 480, ease: draw, out: 10.9, <<: *m_exit, z: 45}
      # number badges: disc ink, digit bg, at the group box's top-left plus (24, 24)
      - {kind: badge, from: [96, 96], r: 18, color: ink, label: "1", label_color: bg, label_font: sans_medium, size: 22, in: 1.46, draw_ms: 240, ease: draw, out: "s2", <<: *m_exit, z: 46}
      - {kind: badge, from: [197, 123], r: 18, color: ink, label: "2", label_color: bg, label_font: sans_medium, size: 22, in: "s2+0.72", draw_ms: 240, ease: draw, out: "s2%45", <<: *m_exit, z: 46}
