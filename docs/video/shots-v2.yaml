  # ---------------------------------------------------------------- 5  THE DECISION 1 OF 4: what is asked, and what comes back
  # VO sentences: s1 "Five typed questions."  s2 "A noul is a yes or no, answered as a probability, so code can
  # compare it to a number."  s3 "Three are about the words: inside the envelope, grounded in what the user
  # said, and what was asked."  s4 "Two are about the frame: a person visible, and what is ahead."
  - id: s05-questions
    kind: card
    duration: auto
    min: 18.6
    vo_offset: 1.0
    vo: "Five typed questions. A noul is a yes or no, answered as a probability, so code can compare it to a number. Three are about the words: inside the envelope, grounded in what the user said, and what was asked. Two are about the frame: a person visible, and what is ahead."
    transition: {kind: push_left, duration: 0.72, ease: camera, inside: true}
    text:
      - {<<: *kicker, text: "THE DECISION  .  1 OF 4"}
      - {kind: title, <<: *t_title, text: "Five typed questions, two requests", color: ink, pos: [96, 104], in: "s1", <<: *m_enter, z: 92}
      - *divider
      # the skeleton: five names, a count of five, recolouring in place on their rows
      - {kind: mono, <<: *t_mono_code, color: ink-mute, text: "inside_envelope", pos: [120, 248], in: "s1", <<: *m_enter_left, recolor: [{at: "s3%28+0.06", color: ink, over_ms: 240, ease: move}], z: 40}
      - {kind: mono, <<: *t_mono_code, color: ink-mute, text: "args_grounded", pos: [120, 348], in: "s1+0.06", <<: *m_enter_left, recolor: [{at: "s3%44+0.06", color: orange, over_ms: 240, ease: move}], accent_group: grounded, z: 40}
      - {kind: mono, <<: *t_mono_code, color: ink-mute, text: "intent", pos: [120, 448], in: "s1+0.12", <<: *m_enter_left, recolor: [{at: "s3%78+0.06", color: ink, over_ms: 240, ease: move}], z: 40}
      - {kind: mono, <<: *t_mono_code, color: ink-mute, text: "person", pos: [120, 604], in: "s1+0.18", <<: *m_enter_left, recolor: [{at: "s4%42+0.06", color: ink, over_ms: 240, ease: move}], z: 40}
      - {kind: mono, <<: *t_mono_code, color: ink-mute, text: "frame", pos: [120, 672], in: "s1+0.24", <<: *m_enter_left, recolor: [{at: "s4%67+0.06", color: ink, over_ms: 240, ease: move}], z: 40}
      # request 1
