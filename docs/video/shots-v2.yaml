      - {<<: *kicker, text: "THE DECISION  .  2 OF 4"}
      - {kind: title, <<: *t_title, text: "From a probability to an action", color: ink, pos: [96, 104], z: 92}
      - {<<: *divider, move: [{at: "s1", box: [1106, 340, 1107, 848], over_ms: 720, ease: move}]}
      # the scale carried over from shot 5 travels to full width; the zones recolour it on their words
