      - {<<: *chip, text: "CONFIRM", verdict: Confirm, pos: [1132, 544], plate: {pad: 14, y: [538, 578]}, in: "s7+0.06", glow: {color: cyan, radius: 18, strength: 0.45, settle: {to: 0.2, over_ms: 480}}}
