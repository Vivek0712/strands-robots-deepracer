      # ticks and values, then the zone labels
      - {kind: panel, box: [1218, 252, 1220, 272], color: green, alpha: 1.0, radius: 0, in: "s2", <<: *m_draw_bar, move: [{at: "s4", box: [1218, 252, 1220, 280], over_ms: 240, ease: draw}, {at: "s4+0.24", box: [1218, 252, 1220, 272], over_ms: 240, ease: move}], recolor: [{at: "s4", color: cyan, over_ms: 240, ease: move}, {at: "s4+0.24", color: green, over_ms: 240, ease: move}], z: 42}
      - {kind: mono, <<: *t_mono_s, color: green, text: "0.65", pos: [1219, 222], anchor: tc, in: "s2", <<: *m_enter, z: 42}
      - {kind: label, <<: *t_body, color: green, text: "0.65 or above: confident yes", pos: [1521, 288], anchor: tc, in: "s2%60", <<: *m_enter, z: 42}
      - {kind: mono, <<: *t_mono_s, color: green, caps: true, track: 0.04, text: "Proceed", pos: [1521, 334], anchor: tc, in: "s2%60+0.06", <<: *m_enter, z: 42}
      - {kind: panel, box: [700, 252, 702, 272], color: red, alpha: 1.0, radius: 0, in: "s3", <<: *m_draw_bar, move: [{at: "s4", box: [700, 252, 702, 280], over_ms: 240, ease: draw}, {at: "s4+0.24", box: [700, 252, 702, 272], over_ms: 240, ease: move}], recolor: [{at: "s4", color: cyan, over_ms: 240, ease: move}, {at: "s4+0.24", color: red, over_ms: 240, ease: move}], z: 42}
      - {kind: mono, <<: *t_mono_s, color: red, text: "0.35", pos: [701, 222], anchor: tc, in: "s3", <<: *m_enter, z: 42}
      - {kind: label, <<: *t_body, color: red, text: "0.35 or below: confident no", pos: [398, 288], anchor: tc, in: "s3%60", <<: *m_enter, z: 42}
      - {kind: mono, <<: *t_mono_s, color: red, caps: true, track: 0.04, text: "Deny", pos: [398, 334], anchor: tc, in: "s3%60+0.06", <<: *m_enter, z: 42}
