  # ---------------------------------------------------------------- 12 THE REUSABLE PATTERN
  - id: s12-pattern
    kind: terminal
    chrome: false
    src: docs/video/build/clips/pattern-demo.txt
    line_range: [7, 9]             # the three gate-log rows of `make pattern-demo`, verbatim
    wrap: 118
    wrap_indent: "  "
    pos: [96, 600]
    width: 1728
    size: 24
    leading: 32
    start: 4.5
    cps: 560                       # about 1120 characters over 2.0 s
    line_pause: 0
    highlight:                     # boxes placed by match string (the row 1 reason wraps over two lines)
      - {match: '"verdict": "Proceed"', color: green, at: 7.0}
      - {match: '"verdict": "Guide"', color: amber, at: 7.0}
      - {match: '"verdict": "Deny"', color: red, at: 7.0}
      - {match: '"reason": "inside', color: orange, at: 7.0}
      - {match: 'envelope p=0.95, grounded p=0.95"', color: orange, at: 7.0}
      - {match: '"reason": "outside envelope: distance_m 2 > 0.5"', color: orange, at: 7.0}
      - {match: '"reason": "decider unavailable: failing closed, no motion"', color: orange, at: 7.0}
    duration: auto
    min: 9.2                       # highlights land at +7.0; hold after the VO trimmed to 0.5 s
    vo_offset: 0.3
    vo: "The pattern is a drop-in. Three files with the upstream names, three lines of wiring, and make pattern demo runs it offline against a fake decider."
    text:
      - {kind: title, text: "Drop it into your own agent", size: 64, pos: [96, 72]}
      - *badge_tr
      - {kind: mono, text: "github.com/Vivek0712/strands-robots-deepracer/tree/main/patterns/strands", size: 26, pos: [112, 966], plate: {box: [80, 952, 1280, 1008], bar: {color: orange, width: 2, x: 96}}}
      - {kind: mono, text: "FAKE DECIDER, STDOUT VERBATIM", size: 28, color: ink-dim, pos: [1824, 964], anchor: tr, plate: {pad: 16, y: [952, 1008]}}
      # row 1, +0.3
      - {kind: label, font: sans_medium, size: 28, color: ink-dim, text: "three files, upstream names", pos: [96, 170], in: 0.3}
      - {kind: mono, size: 28, leading: 40, text: "patterns/strands/\n  _client.py\n  tool_call_intervention.py\n  frame_intervention.py\n  README.md", pos: [96, 220], in: 0.3}
      - {kind: label, font: sans_medium, size: 28, color: ink-dim, text: "three lines of wiring", pos: [616, 170], in: 0.3}
      - {kind: mono, size: 28, leading: 40, pos: [616, 220], in: 0.3, text: "decider = Decider(timeout=1.5)\nagent = Agent(\n    model=BedrockModel(model_id=\"us.amazon.nova-pro-v1:0\",\n                       region_name=\"us-east-1\"),\n    tools=[move],\n    interventions=[MotionGate(decider)],\n)", highlight: [{match: "timeout=1.5", color: cyan, at: 1.5}, {match: "interventions=[MotionGate(decider)]", color: orange, at: 2.5}]}
      # row 2, +4.5
      - {kind: label, size: 28, color: ink-dim, text: "make pattern-demo, against the fake decider (a script, not the model)", pos: [96, 566], in: 4.5}

