      - {kind: mono, size: 28, leading: 44, text: "\"command\": {\"tool\": \"move\",\n  \"arguments\": {\"heading_deg\": 0, \"distance_m\": 0.2}},", pos: [96, 274], in: "s1%42", highlight: [{match: "0.2", color: cyan, at: "s1%42"}]}
      - {kind: mono, size: 28, leading: 44, text: "\"envelope\": \"distance_m <= 0.5 per call,\n  |heading_deg| <= 90\",\n\"deterministic_check\": \"ok\"", pos: [96, 362], in: "s3"}
      - {kind: mono, text: "ANSWER", size: 24, color: ink-dim, pos: [1060, 196], in: "s2"}
