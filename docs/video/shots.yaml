  # ---------------------------------------------------------------- 8  THE RECORDED RUN (v3: each line with its clause)
  # VO sentences: s1 "I type: Go."  s2 "Go carries no distance, so Nova Pro guesses two metres."  s3 "The arithmetic
  # check fails, grounded reads 0.18: Guide, re-plan."  s4 "Nova Pro proposes half a metre."  s5 "Grounded reads
  # 0.40, inside the unsure band: Confirm, the operator is asked."  s6 "The scripted operator says no."
  # s7 "The car never moved on a guessed number."
  # The OPERATOR line is the transcript's verbatim text (round-2 F4), not the v3 paraphrase.
  - id: s08-recorded-run
    kind: terminal
    chrome: false
    pos: [96, 150]
    width: 975
    size: 30
    leading: 38
    cps: 80                        # the five CONFIRM lines must finish before the OPERATOR sentence (2.3 s)
    line_pause: 0.05
    start: 0.3
    cursor: false
    schedule:                      # each line types from its clause; later lines wait for the earlier ones
      - {line: 0, at: "s1%67"}
      - {line: 1, at: "s2%40"}
      - {line: 2, at: "s3"}
      - {line: 3, at: "s3%33"}
      - {line: 4, at: "s3%83"}
      - {line: 5, at: "s4"}
      - {line: 6, at: "s5"}
      - {line: 7, at: "s5%67"}
      - {line: 12, at: "s6"}
      - {line: 13, at: "s7"}
    lines:
      - "USER : Go."
      - '{"arguments": {"heading_deg": 0, "distance_m": 2},'
      - ' "deterministic_check": "distance_m 2 > 0.5",'
      - ' "args_grounded": 0.18, "verdict": "Guide",'
      - ' "reason": "outside envelope: distance_m 2 > 0.5"}'
      - '{"arguments": {"heading_deg": 0, "distance_m": 0.5},'
      - ' "deterministic_check": "ok", "args_grounded": 0.404,'
      - ' "verdict": "Confirm",'
      - ' "reason": "unclear: inside=0.88 grounded=0.40"}'
      - "CONFIRM (operator asked): The decider is unsure about"
      - "  this move (inside envelope p=0.88, grounded p=0.40)."
      - "  Allow it?"
      - "OPERATOR: no (this cell auto-answers False)"
      - "AGENT: (thinking omitted) The move could not be"
      - "  completed because the decider is unsure about it,"
      - "  despite it being within the allowed envelope."
      - "  Please provide further instructions or"
      - "  clarification."
    highlight:                     # boxes placed by match string, 0.4 s after the line starts (once typed)
      - {match: '"distance_m": 2', line: 1, color: orange, at: "s2%40+0.4"}
      - {match: '"distance_m 2 > 0.5"', line: 2, color: orange, at: "s3+0.4"}
      - {match: "0.18", color: amber, at: "s3%33+0.4"}
      - {match: '"Guide"', color: amber, at: "s3%83"}
      - {match: '"distance_m": 0.5', line: 5, color: orange, at: "s4+0.4"}
      - {match: "0.404", color: cyan, at: "s5+0.4"}
      - {match: '"Confirm"', color: cyan, at: "s5%67+0.4"}
      - {match: "OPERATOR: no (this cell auto-answers False)", color: cyan, at: "s6+0.4"}
    duration: auto
    min: 26.5                      # the agent's reply (203 characters at 80 cps from s7) finishes at about +25.9
    vo_offset: 0.3
    vo: "I type: Go. Go carries no distance, so Nova Pro guesses two metres. The arithmetic check fails, grounded reads zero point one eight: Guide, re-plan. Nova Pro proposes half a metre. Grounded reads zero point four zero, inside the unsure band: Confirm, the operator is asked. The scripted operator says no. The car never moved on a guessed number."
    text:
      - {kind: label, size: 32, text: "\"Go.\" carries no distance", color: orange, pos: [1120, 150], in: "s2", recolor: [{at: "s2%40", color: ink-dim}]}
      - {kind: label, size: 32, text: "Nova Pro guesses 2 m", color: orange, pos: [1120, 190], in: "s2%40", recolor: [{at: "s3", color: ink-dim}]}
      - {kind: label, size: 32, text: "check fails: 2 > 0.5; grounded 0.18", color: orange, pos: [1120, 230], in: "s3", recolor: [{at: "s3%83", color: ink-dim}]}
      - {kind: label, size: 32, text: "GUIDE: re-plan", color: orange, pos: [1120, 270], in: "s3%83", recolor: [{at: "s4", color: ink-dim}]}
      - {kind: label, size: 32, text: "Nova Pro proposes 0.5 m", color: orange, pos: [1120, 310], in: "s4", recolor: [{at: "s5", color: ink-dim}]}
      - {kind: label, size: 32, text: "grounded 0.40: the unsure band", color: orange, pos: [1120, 350], in: "s5", recolor: [{at: "s5%67", color: ink-dim}]}
      - {kind: label, size: 32, text: "CONFIRM: the operator is asked", color: orange, pos: [1120, 390], in: "s5%67", recolor: [{at: "s6", color: ink-dim}]}
      - {kind: label, size: 32, text: "scripted operator: no", color: orange, pos: [1120, 430], in: "s6"}
      - {kind: caption, text: "A guessed distance moved nothing.", size: 36, pos: [1120, 520], in: "s7+0.7"}
      - {kind: mono, text: "Agent: Amazon Nova Pro on Bedrock\nJudge: Strands Decider 2B, local", size: 24, leading: 28, color: ink-dim, pos: [1136, 588], plate: {box: [1120, 580, 1614, 648]}}
      - {kind: lower_third, text: "Recorded run, 2026-10-22: the real decider judges Nova Pro"}
      - {kind: mono, text: "RECORDED 2026-10-22, REAL DECIDER + NOVA PRO", size: 28, color: ink-dim, pos: [1824, 964], anchor: tr, plate: {pad: 16, y: [952, 1008]}}

