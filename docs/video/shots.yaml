# Shot list for the hackathon demo video, transcribed from docs/video/SCRIPT.md v2
# ("Shot list for the renderer") and docs/video/STORYBOARD.md v2. Shot numbers match the
# script; shot 13 is two entries (13a, 13b) because its two stills hard-cut at +2.0.
# Coordinates are 1920x1080 frame units; times are seconds from the shot's own start.
# Render: .venv/bin/python -m docs.video.render build docs/video/shots.yaml --out docs/video/build/deepracer-decider-demo.mp4

title: "This car can refuse an order"
voice: Matthew
engine: generative     # generative ignores <prosody rate>; sentences are synthesised one by one instead
vo_sentences: true     # one Polly call per sentence, stitched with vo_gap_ms of silence; onsets measured
vo_gap_ms: 600         # 600 ms of real silence between sentences (tails kept to 120 ms past -50 dBFS)
# Reveal times may be anchors: "s3" = onset of the VO's third sentence, "s3%40" = 40 percent
# into it (word position), "s3+0.4" = 0.4 s after it. Resolved from the measured onsets.
auto_pad: 0.5          # picture = max(min, vo_offset + VO length + 0.5 s)
fade_out: 0.5          # shot 14 fades to black over its last 0.5 s
# No music bed: the round-3 QA measured it pumping at sentence ends and the loop licence for
# Builder Center distribution is unconfirmed. The renderer adds nothing to the audio track.
defaults:
  transition: cut

# Recurring elements (YAML anchors; the renderer ignores this top-level key).
snippets:
  badge_top_right: &badge_tr
    kind: mono
    text: "Agent: Amazon Nova Pro on Bedrock\nJudge: Strands Decider 2B, local"
    size: 24
    leading: 28
    color: ink-dim
    pos: [1360, 80]
    plate: {box: [1344, 72, 1840, 140]}
  safety_line: &safety "Physics stops the car. The decider explains."

shots:
  # ---------------------------------------------------------------- 1  HOOK A
  - id: s01-hook-a
    kind: clip
    src: docs/results/portal/pitwall-sim.webm
    start: 2.5
    end: 3.2                       # then hold the 3.2 s frame (DENY, LED red)
    crop: [0, 40, 910, 720]        # live view + verdict panel
    place: [0, 0, 1447, 1080]      # 1.59x, anchored left; the right column is bg
    mute: true
    duration: auto
    min: 4.0
    vo_offset: 1.0
    vo: "This car can refuse an order."
    text:
      - {kind: title, text: "This car", size: 56, pos: [1500, 120], in: 1.0, fade: 0.3}
      - {kind: title, text: "can refuse", size: 56, pos: [1500, 190], in: 1.0, fade: 0.3}
      - {kind: title, text: "an order.", size: 56, pos: [1500, 260], in: 1.0, fade: 0.3}
      - {kind: mono, text: "SIM, FAKE DECIDER,", size: 28, color: ink-dim, pos: [1500, 940]}
      - {kind: mono, text: "DRAWN FIGURE", size: 28, color: ink-dim, pos: [1500, 972]}
    pointers:
      # red pulse around the LED RED label, two pulses of 0.3 s
      - {kind: highlight, from: [1310, 8], to: [1432, 48], color: red, fill: 0.2, in: 0.4, pulse: {count: 2, period: 0.3}}

  # ---------------------------------------------------------------- 1b THE CAR (phase-3 recording, two parts, 4.0 s)
  # Part a: the car's own camera feed under the phase-3 Nova vision planner with the boxed REPLAN line already
  # logged (clips/phase3-replan-1080p.mp4 from 2.8 s, the scout's composition cropped to its content and placed
  # 0.88x so the honesty label and the caption plate sit clear of it). Part b: hard cut to the real car steering
  # left past the toy car (clips/phase3-thirdperson-1080p.mp4 4.6-7.0 s, the phone column over its blur fill as
  # the scout cut it). Pre-decider footage: the label says so on both parts.
  - id: s01b-feed
    kind: clip
    src: docs/video/build/clips/phase3-replan-1080p.mp4
    start: 2.8
    end: 4.4
    crop: [391, 27, 1524, 1060]    # the feed image and its log plate
    place: [600, 20, 1597, 929]    # 0.88x, right of the caption plate, above the honesty label
    mute: true
    duration: 1.6
    vo_offset: 0.5
    vo: "This is a stock AWS DeepRacer."
    text:
      - {kind: caption, text: "A stock AWS DeepRacer", size: 40, pos: [96, 72], in: 0.2, plate: {box: [80, 60, 585, 132]}}
      - {kind: mono, text: "REAL CAR, PHASE-3 VISION PLANNER, PRE-DECIDER", size: 28, color: ink-dim, pos: [1824, 964], anchor: tr, plate: {pad: 16, y: [952, 1008]}}
  - id: s01b-car
    kind: clip
    src: docs/video/build/clips/phase3-thirdperson-1080p.mp4
    start: 4.6
    end: 7.0
    place: [0, 0, 1920, 1080]      # already the phone column fitted to 1080 over a darkened blur fill
    mute: true
    duration: 2.4
    text:
      - {kind: caption, text: "A stock AWS DeepRacer", size: 40, pos: [96, 72], plate: {box: [80, 60, 585, 132]}}
      - {kind: mono, text: "REAL CAR, PHASE-3 VISION PLANNER, PRE-DECIDER", size: 28, color: ink-dim, pos: [1824, 964], anchor: tr, plate: {pad: 16, y: [952, 1008]}}

  # ---------------------------------------------------------------- 2  HOOK B
  - id: s02-hook-b
    kind: still
    src: docs/results/portal/pitwall-sim.webm
    at: 3.2                        # the shot 1 freeze frame
    crop: [0, 40, 910, 720]
    place: [0, 0, 1447, 1080]
    duration: auto
    min: 5.5                       # Polly reads this in 3.7 s; 5.5 keeps `Here is why.` on screen 1.5 s
    vo_offset: 0.3
    vo: "A person in the frame. The hop was refused. Here is why."
    black_out: 0.15                # the dip into shot 3
    text:
      - {kind: label, text: "Physics stops the car.", size: 26, color: ink-dim, pos: [1500, 840]}
      - {kind: label, text: "The decider explains.", size: 26, color: ink-dim, pos: [1500, 872]}
      - {kind: mono, text: "SIM, FAKE DECIDER,", size: 28, color: ink-dim, pos: [1500, 940]}
      - {kind: mono, text: "DRAWN FIGURE", size: 28, color: ink-dim, pos: [1500, 972]}
      - {kind: caption, text: "Here is why.", size: 40, pos: [1500, 120], in: 3.0}
    pointers:
      - {kind: circle, from: [215, 180], to: [595, 560], color: cyan, width: 4, in: 0.3}          # centre (405, 370) r 190
      - {kind: highlight, from: [40, 545], to: [310, 625], color: cyan, in: 1.0}                  # FRAME CLASS chip
      - {kind: highlight, from: [615, 545], to: [770, 625], color: cyan, in: 1.0}                 # PROBABILITY chip
      - {kind: arrow, from: [557, 484], to: [685, 548], color: cyan, in: 1.0}
      - {kind: highlight, from: [825, 135], to: [1107, 262], color: red, in: 2.5}                 # the DENY word

  # ---------------------------------------------------------------- 3  WHAT IT IS (v3: callouts every 1.25 s, 26-word VO)
  - id: s03-what-it-is
    kind: still
    src: docs/video/build/clips/layers/base.png     # fig-deepracer-strands.html, callouts hidden
    crop: [0, 100, 1600, 900]      # below the baked title; the baked footer stays
    place: [240, 190, 1680, 910]   # 0.9x
    layers:                        # one PNG per callout (box, leader line, dot), from the same HTML
      - {src: docs/video/build/clips/layers/callout1.png, at: 0.5, fade: 0.3}
      - {src: docs/video/build/clips/layers/callout2.png, at: 1.75, fade: 0.3, settle_at: 9.5, settle_to: 0.7}
      - {src: docs/video/build/clips/layers/callout3.png, at: 3.0, fade: 0.3, settle_at: 9.5, settle_to: 0.7}
      - {src: docs/video/build/clips/layers/callout4.png, at: 4.25, fade: 0.3, settle_at: 9.5, settle_to: 0.7}
      - {src: docs/video/build/clips/layers/callout5.png, at: 5.5, fade: 0.3, settle_at: 9.5, settle_to: 0.7}
      - {src: docs/video/build/clips/layers/callout6.png, at: 6.75, fade: 0.3, settle_at: 9.5, settle_to: 0.7}
      - {src: docs/video/build/clips/layers/callout7.png, at: 8.0, fade: 0.3, settle_at: 9.5, settle_to: 0.7}
    duration: auto
    min: 9.5
    black_in: 0.3
    vo_offset: 0.4
    vo: "I am Vivek Raja. A Strands agent on Bedrock turns my words into hops; a local Decider two B judges each one before the wheels turn."
    text:
      - {kind: title, text: "Driven as a Strands robot", size: 64, pos: [96, 72], in: 0.4}
      # callout label plates, 44 px tall at the box's top edge minus 24, text at plate x + 12
      - {kind: label, font: sans_medium, size: 30, color: orange, text: "Decider on the camera", pos: [279, 187], in: 0.5, fade: 0.3, plate: {pad: 12, pad_y: 3, alpha: 1.0}}
      - {kind: label, font: sans_medium, size: 30, text: "strands-robots on the drive", pos: [279, 349], in: 1.75, fade: 0.3, plate: {pad: 12, pad_y: 3, alpha: 1.0}}
      - {kind: label, font: sans_medium, size: 30, text: "The deadman on the servos", pos: [279, 565], in: 3.0, fade: 0.3, plate: {pad: 12, pad_y: 3, alpha: 1.0}}
      - {kind: label, font: sans_medium, size: 30, text: "Harness on the compute", pos: [1413, 178], in: 4.25, fade: 0.3, plate: {pad: 12, pad_y: 3, alpha: 1.0}}
      - {kind: label, font: sans_medium, size: 30, text: "Agents as the loop", pos: [1413, 353], in: 5.5, fade: 0.3, plate: {pad: 12, pad_y: 3, alpha: 1.0}}
      - {kind: label, font: sans_medium, size: 30, text: "Bidi as the voice", pos: [1413, 529], in: 6.75, fade: 0.3, plate: {pad: 12, pad_y: 3, alpha: 1.0}}
      - {kind: label, font: sans_medium, size: 30, text: "Box around the process", pos: [1413, 691], in: 8.0, fade: 0.3, plate: {pad: 12, pad_y: 3, alpha: 1.0}}
      - {kind: lower_third, text: "Vivek Raja, AWS AI Hero", in: 0.4}
      - {kind: mono, text: "Agent: Amazon Nova Pro on Bedrock\nJudge: Strands Decider 2B, local", size: 24, leading: 30, color: ink-dim, pos: [1300, 936], in: 3.0, plate: {box: [1284, 926, 1840, 1008]}}

  # ---------------------------------------------------------------- 4  ARCHITECTURE (v3: three groups keyed to the three sentences)
  # VO sentences: s1 "Nova Pro proposes the move."  s2 "A Strands intervention handler asks the decider before
  # the tool runs."  s3 "The on-car deadman needs none of it."  Group 1 is on screen from frame 0 (hard cut).
  - id: s04-architecture
    kind: still
    src: docs/article/img/fig-architecture.png
    place: [96, 200, 1376, 920]    # 0.8x
    base_brightness: 0.35
    regions:                       # lit to 100 percent over 0.4 s, earlier groups settle at 80
      - {box: [128, 224, 752, 324], at: 0.0, settle_to: 0.8}     # R1 Bedrock
      - {box: [160, 416, 384, 512], at: 0.0, settle_to: 0.8}     # R2 Strands Agents
      - {box: [400, 416, 728, 512], at: "s2", settle_to: 0.8}    # R3 DeciderGate + Decider 2B
      - {box: [160, 520, 728, 684], at: "s3", settle_to: 0.8}    # R4 strands-robots
      - {box: [960, 360, 1344, 892], at: "s3", settle_to: 0.8}   # R5 DeepRacer (deadman sub-box inside)
    duration: auto
    min: 9.5
    vo_offset: 0.3
    vo: "Nova Pro proposes the move. A Strands intervention handler asks the decider before the tool runs. The on-car deadman needs none of it."
    text:
      - {kind: label, text: "1 Nova Pro proposes the move", color: orange, pos: [1392, 200], recolor: [{at: "s2", color: ink-dim}]}
      - {kind: label, text: "2 Strands Agents runs the tools", color: orange, pos: [1392, 240], recolor: [{at: "s2", color: ink-dim}]}
      - {kind: label, text: "3 Decider 2B judges,", color: orange, pos: [1392, 280], in: "s2", recolor: [{at: "s3", color: ink-dim}]}
      - {kind: label, text: "  before the tool runs", color: orange, pos: [1392, 320], in: "s2", recolor: [{at: "s3", color: ink-dim}]}
      - {kind: label, text: "4 strands-robots carries it", color: orange, pos: [1392, 360], in: "s3"}
      - {kind: label, text: "  over rosbridge", color: orange, pos: [1392, 400], in: "s3"}
      - {kind: label, text: "5 On-car deadman: stops", color: orange, pos: [1392, 440], in: "s3"}
      - {kind: label, text: "  without the laptop", color: orange, pos: [1392, 480], in: "s3"}
      - {kind: mono, text: "Agent: Amazon Nova Pro on Bedrock\nJudge: Strands Decider 2B, local", size: 24, leading: 28, color: ink-dim, pos: [1360, 548], plate: {box: [1344, 540, 1840, 608]}}
      - {kind: lower_third, text: "Architecture"}
    pointers:
      - {kind: box, from: [128, 224], to: [752, 324], color: cyan, width: 3}
      - {kind: box, from: [160, 416], to: [384, 512], color: cyan, width: 3}
      - {kind: box, from: [400, 416], to: [728, 512], color: orange, width: 3, in: "s2"}
      - {kind: box, from: [160, 520], to: [728, 684], color: cyan, width: 3, in: "s3"}
      - {kind: box, from: [960, 360], to: [1344, 892], color: cyan, width: 3, in: "s3"}
      - {kind: box, from: [976, 552], to: [1328, 676], color: red, width: 3, in: "s3"}            # deadman sub-box
      - {kind: badge, from: [128, 224], color: orange, label: "1"}
      - {kind: badge, from: [160, 416], color: orange, label: "2"}
      - {kind: badge, from: [400, 416], color: orange, label: "3", in: "s2"}
      - {kind: badge, from: [160, 520], color: orange, label: "4", in: "s3"}
      - {kind: badge, from: [960, 360], color: orange, label: "5", in: "s3"}
      - {kind: arrow, from: [752, 464], to: [960, 464], color: orange, in: "s2"}                   # along "commands 20 Hz"

  # ---------------------------------------------------------------- 5  THE DECISION, part 1 (v3: one idea at a time, keyed to the voice)
  # VO sentences: s1 "Five typed questions."  s2 "A noul is a yes or no, answered as a probability, so code can
  # compare it to a number."  s3 "Three are about the words: inside the envelope, grounded in what the user
  # said, and what was asked."  s4 "Two are about the frame: a person visible, and what is ahead."
  # Percentages are word positions inside the sentence.
  - id: s05-questions
    kind: card
    duration: auto
    min: 18.6                      # the 600 ms sentence gaps: hold after the VO trimmed to 0.5 s
    vo_offset: 1.0
    vo: "Five typed questions. A noul is a yes or no, answered as a probability, so code can compare it to a number. Three are about the words: inside the envelope, grounded in what the user said, and what was asked. Two are about the frame: a person visible, and what is ahead."
    text:
      - {kind: title, text: "Five typed questions, two requests", size: 56, pos: [96, 72]}
      - {kind: lower_third, text: "The five questions"}
      - {kind: mono, text: "Agent: Amazon Nova Pro on Bedrock\nJudge: Strands Decider 2B, local", size: 24, leading: 30, color: ink-dim, pos: [1300, 936], plate: {box: [1284, 926, 1840, 1008]}}
      # what a noul is, three lines with their clauses
      - {kind: label, size: 36, text: "noul = a yes/no question", pos: [96, 160], in: "s2", anim: slide_left, fade: 0.3}
      - {kind: label, size: 36, text: "answered as a probability, 0 to 1, not a sentence", pos: [96, 210], in: "s2%37", anim: slide_left, fade: 0.3}
      - {kind: label, size: 36, text: "so code can compare it to a number", pos: [96, 260], in: "s2%58", anim: slide_left, fade: 0.3}
      # request 1
      - {kind: label, font: sans_medium, size: 32, color: ink-dim, text: "Request 1: the words", pos: [96, 340], in: "s3"}
      - {kind: mono, size: 30, text: "inside_envelope", pos: [96, 390], in: "s3%28", anim: slide_left, fade: 0.3}
      - {kind: label, size: 36, text: "Is the proposed movement inside the envelope the operator briefed?", pos: [520, 390], in: "s3%28", anim: slide_left, fade: 0.3}
      - {kind: mono, size: 30, text: "args_grounded", pos: [96, 450], in: "s3%44", anim: slide_left, fade: 0.3}
      - {kind: label, size: 36, text: "Are the tool's argument values grounded in what the user actually said?", pos: [520, 450], in: "s3%44", anim: slide_left, fade: 0.3}
      - {kind: mono, size: 30, text: "intent", pos: [96, 510], in: "s3%78", anim: slide_left, fade: 0.3}
      - {kind: mono, size: 26, color: ink-dim, text: "choice", pos: [96, 548], in: "s3%78", anim: slide_left, fade: 0.3}
      - {kind: label, size: 36, text: "What did the user most recently ask the robot to do?", pos: [520, 510], in: "s3%78", anim: slide_left, fade: 0.3}
      - {kind: mono, size: 26, color: ink-dim, text: "move_forward   turn   stop   question   unrelated", pos: [520, 556], in: "s3%78", anim: slide_left, fade: 0.3}
      # request 2
      - {kind: label, font: sans_medium, size: 32, color: ink-dim, text: "Request 2: the frame, 480x360 JPEG", pos: [96, 640], in: "s4"}
      - {kind: mono, size: 30, text: "person", pos: [96, 690], in: "s4%42", anim: slide_left, fade: 0.3}
      - {kind: label, size: 36, text: "Is a person visible in the frame?", pos: [520, 690], in: "s4%42", anim: slide_left, fade: 0.3}
      - {kind: mono, size: 30, text: "frame", pos: [96, 750], in: "s4%67", anim: slide_left, fade: 0.3}
      - {kind: mono, size: 26, color: ink-dim, text: "choice", pos: [96, 788], in: "s4%67", anim: slide_left, fade: 0.3}
      - {kind: label, size: 36, text: "What is directly in front of the car in this camera frame?", pos: [520, 750], in: "s4%67", anim: slide_left, fade: 0.3}
      - {kind: mono, size: 26, color: ink-dim, text: "clear   obstacle_near   person_in_frame   off_surface   unclear", pos: [520, 796], in: "s4%67", anim: slide_left, fade: 0.3}
    pointers:                      # 2 px leading bars with their rows
      - {kind: bar, from: [86, 386], to: [88, 426], color: cyan, in: "s3%28"}
      - {kind: bar, from: [86, 446], to: [88, 486], color: orange, in: "s3%44"}
      - {kind: bar, from: [86, 506], to: [88, 546], color: cyan, in: "s3%78"}
      - {kind: bar, from: [86, 686], to: [88, 726], color: cyan, in: "s4%42"}
      - {kind: bar, from: [86, 746], to: [88, 786], color: cyan, in: "s4%67"}

  # ---------------------------------------------------------------- 6  THE DECISION, part 2 (v3: thresholds, then one example per action)
  # VO sentences: s1 "Two thresholds make the action."  s2 "0.65 or above: a confident yes."  s3 "0.35 or below:
  # a confident no."  s4 "Between them, the operator is asked."  s5 "A person in frame: Deny."  s6 "An invented
  # distance: Guide, re-plan."  s7 "Unsure: Confirm."  s8 "Otherwise: Proceed."  s9 "A late or missing decider
  # is a Deny: the gate never fails open."
  - id: s06-rows
    kind: card
    duration: auto
    min: 22.0
    vo_offset: 0.3
    vo: "Two thresholds make the action. Zero point six five or above: a confident yes. Zero point three five or below: a confident no. Between them, the operator is asked. A person in frame: Deny. An invented distance: Guide, re-plan. Unsure: Confirm. Otherwise: Proceed. A late or missing decider is a Deny: the gate never fails open."
    text:
      - {kind: title, text: "From a probability to an action", size: 56, pos: [96, 72]}
      - {kind: lower_third, text: "Thresholds and actions"}
      - *badge_tr
      # the ruler
      - {kind: panel, box: [299, 180, 302, 880], color: ink-dim, alpha: 1.0, radius: 0, in: "s1"}
      - {kind: mono, text: "1.0", size: 26, color: ink-dim, pos: [250, 168], in: "s1"}
      - {kind: mono, text: "0.0", size: 26, color: ink-dim, pos: [250, 868], in: "s1"}
      - {kind: panel, box: [280, 423, 320, 427], color: green, alpha: 1.0, radius: 0, in: "s2"}
      - {kind: panel, box: [280, 180, 320, 425], color: green, alpha: 0.15, radius: 0, in: "s2"}
      - {kind: label, size: 36, text: "0.65 or above: confident yes", pos: [340, 405], in: "s2", anim: slide_left, fade: 0.3}
      - {kind: panel, box: [280, 633, 320, 637], color: red, alpha: 1.0, radius: 0, in: "s3"}
      - {kind: panel, box: [280, 635, 320, 880], color: red, alpha: 0.15, radius: 0, in: "s3"}
      - {kind: label, size: 36, text: "0.35 or below: confident no", pos: [340, 615], in: "s3", anim: slide_left, fade: 0.3}
      - {kind: panel, box: [280, 425, 320, 635], color: cyan, alpha: 0.2, radius: 0, in: "s4"}
      - {kind: label, size: 36, text: "between: ask the operator", pos: [340, 510], in: "s4", anim: slide_left, fade: 0.3}
      # one example per action
      - {kind: label, size: 36, text: "a person in frame", pos: [1000, 300], in: "s5", anim: slide_left, fade: 0.3}
      - {kind: chip, text: "DENY", bg: red, pos: [1560, 298], in: "s5", anim: slide_left, fade: 0.3}
      - {kind: label, size: 36, text: "an invented distance", pos: [1000, 400], in: "s6", anim: slide_left, fade: 0.3}
      - {kind: chip, text: "GUIDE", bg: amber, pos: [1560, 398], in: "s6", anim: slide_left, fade: 0.3}
      - {kind: label, size: 28, color: ink-dim, text: "re-plan", pos: [1000, 444], in: "s6", anim: slide_left, fade: 0.3}
      - {kind: label, size: 36, text: "unsure, in the band", pos: [1000, 500], in: "s7", anim: slide_left, fade: 0.3}
      - {kind: chip, text: "CONFIRM", bg: cyan, pos: [1560, 498], in: "s7", anim: slide_left, fade: 0.3}
      - {kind: label, size: 28, color: ink-dim, text: "ask the operator", pos: [1000, 544], in: "s7", anim: slide_left, fade: 0.3}
      - {kind: label, size: 36, text: "otherwise", pos: [1000, 600], in: "s8", anim: slide_left, fade: 0.3}
      - {kind: chip, text: "PROCEED", bg: green, pos: [1560, 598], in: "s8", anim: slide_left, fade: 0.3}
      - {kind: label, size: 32, text: "a late or missing decider", pos: [1000, 720], in: "s9", anim: slide_left, fade: 0.3}
      - {kind: chip, text: "DENY", bg: red, pos: [1560, 718], in: "s9", anim: slide_left, fade: 0.3}
      - {kind: label, size: 32, color: ink-dim, text: "The gate never fails open.", pos: [1000, 790], in: "s9%62"}
      - {kind: label, size: 26, leading: 34, color: ink-dim, text: "Row 7 on the car: Confirm (the marshal may approve\na bigger hop); in the library: Guide.", pos: [1000, 850], in: "s9%62"}

  # ---------------------------------------------------------------- 7  THE DECISION, part 3 (v3: the real request read slowly)
  # VO sentences: s1 "The user said twenty centimetres; the tool call says zero point two."  s2 "Grounded: 0.91."
  # s3 "Inside the envelope: 0.95."  s4 "Intent: move forward."  s5 "A Proceed, in 583 ms."
  # Request lines are Menlo 28 (Menlo 30 runs into the answer column); the answer column starts at x 1060.
  - id: s07-one-request
    kind: card
    duration: auto
    min: 13.0
    vo_offset: 0.3
    vo: "The user said twenty centimetres; the tool call says zero point two. Grounded: zero point nine one. Inside the envelope: zero point nine five. Intent: move forward. A Proceed, in five hundred eighty three milliseconds."
    text:
      - {kind: title, text: "One real request, one real answer", size: 56, pos: [96, 72]}
      - *badge_tr
      - {kind: mono, text: "RECORDED 2026-10-22, REAL DECIDER + NOVA PRO", size: 28, color: ink-dim, pos: [1824, 964], anchor: tr, plate: {pad: 16, y: [952, 1008]}}
